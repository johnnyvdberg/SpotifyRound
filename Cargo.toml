[package]
name = "spotify-round"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A round Spotify now-playing display for the Raspberry Pi"
license = "MIT"
build = "build.rs"

[[bin]]
name = "spotify-round"
path = "src/main.rs"

[features]
# Render straight through DRM/KMS with the GPU, for a Pi running without a
# compositor (`cargo build --release --features kms`).
kms = ["slint/backend-linuxkms"]
# The Nautilus dive is 1080 x 1080 only. This feature is mandatory (and on by
# default); the app refuses to compile without it so no 448 profile can creep
# back in.
full-hd = []
# The renderers Slint draws the window with, on the shared wgpu device: Skia on
# Vulkan (Skia cannot draw on a GL wgpu device) and femtovg on OpenGL ES, whose
# driver gives the Pi's V3D early-Z. The device's backend picks between them at
# start-up (`gpu::install`); femtovg is vendored with its shader specialised per
# pipeline for the V3D (`vendor/femtovg`).
default = ["skia", "femtovg", "full-hd"]
skia = ["slint/renderer-skia"]
femtovg = ["slint/renderer-femtovg-wgpu"]

[dependencies]
animato = "1.7.3"
anyhow = "1.0.104"
base64 = "0.23.1"
half = "2"
bytemuck = "1.24"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
# The seabed's heightmap noise (OpenSimplex2, ridged, cellular, domain warp).
fastnoise-lite = "1.1.1"
# CPU vector math in the mesh generator.
glam = "0.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
# Vertex-fetch and post-transform-cache ordering for the generated models.
meshopt = "0.7"
pollster = "0.3"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# The UI and the idle globe both render through wgpu on Vulkan: one device, one
# stack, and the globe's texture is handed to Slint without a copy.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "compat-1-2",
    "accessibility",
    "unstable-wgpu-30",
] }
thiserror = "2.0.21"
# Slint's winit backend and core, named directly for the patched backend's
# `request_graphics_api_for_display` (see `[patch.crates-io]` and `gpu::install`).
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
i-slint-core = { version = "=1.18.1", default-features = false, features = ["unstable-wgpu-30"] }
# The same wgpu as `slint::wgpu_30`, named here for its default features: WGSL
# shaders and the Vulkan, Metal and GL backends, whichever renderer Slint uses.
wgpu = "30"
# Timer-query scopes around the Nautilus encoder; self-disables without timestamps.
wgpu-profiler = "0.28"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[build-dependencies]
slint-build = "1.18"
# Links the WESL shader package into plain WGSL before wgpu sees it.
wesl = "0.6"
# Decodes the Earth's maps, which build.rs compresses to ETC2 and EAC.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff"] }

# Keep the application crate easy to debug, but never run the renderer
# unoptimized: Slint, femtovg and wgpu are several times slower at `opt-level =
# 0`, which makes a 60 Hz scene miss its frame budget even on a fast GPU.
[profile.dev]
opt-level = 1
# Line tables only: enough to step through, much faster to build and load.
debug = 1

[profile.dev.package."*"]
opt-level = 2

# build.rs compresses the Earth's maps to ETC2, which takes minutes unoptimised.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
] }
# An independent ETC2 decoder, to check `etc`'s own against.
texture2ddecoder = "0.1.2"

# The V3D's performance counters, by ioctl on the render node (`v3d_perf`).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.191"

# Slint's winit backend with one addition: the graphics API can be chosen from
# the event loop's display connection, so the GL device presents under cage.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
# femtovg 0.27.0 with its fragment shader specialised per pipeline and a
# tiler's load/store ops (see `Tuning` in `vendor/femtovg/src/renderer/wgpu.rs`).
femtovg = { path = "vendor/femtovg" }
